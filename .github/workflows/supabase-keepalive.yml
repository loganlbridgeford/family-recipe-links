name: Supabase keep-alive

on:
  schedule:
    # Days 1, 3, 5, ... so the gap stays under the 7-day free-tier pause.
    - cron: '17 12 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one keep-alive row
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import re, pathlib, shlex
          text = pathlib.Path('js/config.js').read_text()
          url = re.search(r"SUPABASE_URL:\s*'([^']+)'", text)
          key = re.search(r"SUPABASE_ANON_KEY:\s*'([^']+)'", text)
          if not url or not key:
              raise SystemExit('js/config.js is missing SUPABASE_URL or SUPABASE_ANON_KEY')
          print('URL=' + shlex.quote(url.group(1)))
          print('KEY=' + shlex.quote(key.group(1)))
          PY
          )"
          code="$(curl -sS -o /tmp/keep-alive.json -w '%{http_code}' \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            -H "Accept: application/json" \
            "${URL%/}/rest/v1/keep_alive?select=id&limit=1")"
          echo "HTTP ${code}"
          cat /tmp/keep-alive.json
          echo
          python3 - "$code" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          rows = json.loads(open('/tmp/keep-alive.json').read())
          if status < 200 or status >= 300:
              raise SystemExit(1)
          if not isinstance(rows, list) or len(rows) < 1:
              raise SystemExit('expected one keep_alive row')
          PY
