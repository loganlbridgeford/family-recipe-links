<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Recipe Links</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-bg"></div>

  <div class="container">
    <!-- Family Photo Banner -->
    <div class="family-banner">
      <img src="family.jpg" alt="Bridgeford Family" class="family-photo">
      <div class="banner-overlay">
        <h1>Family Recipe Links</h1>
        <p class="subtitle">Shared recipes from the family</p>
      </div>
    </div>

    <!-- Add Recipe Form -->
    <section class="add-form">
      <h2>Add a Recipe</h2>
      <form id="recipeForm">
        <div class="form-group">
          <label for="recipeName">Recipe Name</label>
          <input type="text" id="recipeName" placeholder="e.g. Grandma's Chili" required>
        </div>

        <div class="form-group">
          <label for="recipeUrl">Recipe URL</label>
          <input type="url" id="recipeUrl" placeholder="https://..." (optional if uploading a photo)">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">Select category</option>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
              <option value="Appetizer">Appetizer</option>
              <option value="Dessert">Dessert</option>
              <option value="Snack">Snack</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="addedBy">Added by</label>
            <select id="addedBy" required>
              <option value="">Select who</option>
              <option value="Logan">Logan</option>
              <option value="Nadine">Nadine</option>
              <option value="John C.">John C.</option>
              <option value="Neileen">Neileen</option>
              <option value="John A.">John A.</option>
              <option value="Abbie">Abbie</option>
              <option value="Tyler">Tyler</option>
              <option value="Monica">Monica</option>
            </select>
          </div>
        </div>

	<div class="form-group">
  	  <label for="photo">Photo of Recipe Card (optional)</label>
  	  <input type="file" id="photo" accept="image/*" capture="environment">
  	  <p style="font-size: 0.8rem; color: #666; margin-top: 4px;">
    	  Take a photo or choose one from your phone
  	</p>
	</div>

        <div class="form-group">
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" rows="2" placeholder="Any tips, what you liked, etc."></textarea>
        </div>

        <button type="submit" class="btn-primary">Add Recipe</button>
      </form>
    </section>

    <!-- Search + Filters -->
    <section class="controls">
      <input type="search" id="searchInput" placeholder="Search recipes, people, or URLs…">
      
      <div class="filter-chips" id="filterChips">
        <button type="button" class="chip active" data-category="All">All</button>
        <button type="button" class="chip" data-category="Breakfast">Breakfast</button>
        <button type="button" class="chip" data-category="Lunch">Lunch</button>
        <button type="button" class="chip" data-category="Dinner">Dinner</button>
        <button type="button" class="chip" data-category="Appetizer">Appetizer</button>
        <button type="button" class="chip" data-category="Dessert">Dessert</button>
        <button type="button" class="chip" data-category="Snack">Snack</button>
        <button type="button" class="chip" data-category="Other">Other</button>
      </div>
    </section>

    <!-- Recipe List -->
    <section class="recipe-list">
      <h2>Family Recipes <span id="recipeCount"></span></h2>
      <div id="recipesContainer">
        <!-- Recipes appear here -->
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
